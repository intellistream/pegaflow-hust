# Ruff configuration for pegaflow-hust repo root.
# The CI action runs `ruff check` from the repo root.

extend-exclude = [
    "target/",
    ".github/",
    "pegaflow-core/",
    # Benchmark scripts — not production code
    "run_bench_8inst.py",
    "run_bench_8inst_concurrent.py",
    "run_bench_mla_tp8_concurrent.py",
    # Upstream scripts with pre-existing issues
    "scripts/",
]

[lint]
ignore = []
